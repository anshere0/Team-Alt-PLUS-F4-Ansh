services:
  # The FastAPI Web Server
  - type: web
    name: gridguard-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        # Update this to match your Vercel deployment URL
        value: "http://localhost:3000,https://your-vercel-app-url.vercel.app"

  # The Background Telemetry Simulator
  - type: worker
    name: gridguard-simulator
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.worker"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        # Pulls the database URL from the web service
        fromService:
          type: web
          name: gridguard-backend
          envVarKey: DATABASE_URL
